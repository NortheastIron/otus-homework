<section class="app-to-do-list">
    <h1>Todo List</h1>

    @if (tasks().length) {
        <ul class="app-to-do-list__list">
            @for (item of tasks(); track $index) {
                <li class="app-to-do-list__list__item">
                    <app-to-do-item [data]="item" (itemEvent)="onHandlerItemEvent($event)"></app-to-do-item>
                </li>
            }
        </ul>
    }
    

    <!-- @if (!tasks().length) {
        <h2>Пусто</h2>
    } -->

    <div class="app-to-do-list__actions">
        <mat-form-field>
            <mat-label>Add your new todo</mat-label>
            <input matInput type="text" placeholder="Enter text..." [(ngModel)]="taskText">
        </mat-form-field>
        <button class="button button--add" [disabled]="taskText.length === 0" (click)="onAddTask()">Add task</button>
    </div>
</section>
