@let taskData = data();

<section class="app-to-do-details-view">
    <div class="app-to-do-details-view__title">{{
        taskData.text || '---'
    }}</div>
    <div class="app-to-do-details-view__status">
        {{ taskData.status ? taskStatuses[taskData.status] : '---' }}
    </div>
    <div class="app-to-do-details-view__description">{{taskData.description || '---'}}</div>
</section>
