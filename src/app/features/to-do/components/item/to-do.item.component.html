<div class="app-to-do-item" [class.app-to-do-item_selected]="isSelected()" app-tooltip="Кликните для подробностей">
    <span class="app-to-do-item__text">{{data().text}}</span>
    <button app-button-title="Delete" class="app-button app-button_delete" (click)="onRemove($event)" app-tooltip="Удалить задачу">Delete</button>
</div>
