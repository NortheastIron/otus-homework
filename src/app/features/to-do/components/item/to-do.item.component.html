@let taskData = data();
@let isViewItem = isView();
@let isEditItem = isEdit();

<div class="app-to-do-item"
     [class.app-to-do-item_view]="isViewItem"
     [class.app-to-do-item_edited]="isEditItem"
     appTooltip="Кликните для подробностей"
     [appTooltipIsDisabled]="isEditItem || isViewItem">
    <input class="app-to-do-item__checkbox"
           type="checkbox"
           [checked]="isSelect()"
           (change)="onCheckboxChanged()"
           appTooltip="Кликните для изменения">
    <div class="app-to-do-item__status"
         [class]="{
            'app-to-do-item__status_new' : taskData.status === taskStatus.NEW,
            'app-to-do-item__status_inprogress' : taskData.status === taskStatus.INPROGRESS,
            'app-to-do-item__status_completed' : taskData.status === taskStatus.COMPLETED,
         }">
    </div>
    @if (isEditItem) {
        <mat-form-field class="app-to-do-item__field">
            <mat-label>Todo name</mat-label>
            <input name="taskName"
                   matInput
                   type="text"
                   placeholder="Enter text..."
                   [errorStateMatcher]="defaultMatcher"
                   [formControl]="taskNameControl"> 
        </mat-form-field>
        <div class="app-to-do-item__field-actions">
            <button app-icon-button-class="CONFIRM"
                    [disabled]="taskNameControl.invalid"
                    (click)="onSaveChanges()"
                    appTooltip="Сохранить изменения"
                    [appTooltipIsDisabled]="taskNameControl.invalid">
                +
            </button>
            <button app-icon-button-class="CANCEL"
                    (click)="onCancelChanges()"
                    appTooltip="Отменить">
                X
            </button>
        </div>
        
    } @else {
        <span class="app-to-do-item__text">{{taskData.text}}</span>
    }
    <button app-button [appButtonType]="typesButton.DELETE" (click)="onRemove()" appTooltip="Удалить задачу">Delete</button>
</div>
