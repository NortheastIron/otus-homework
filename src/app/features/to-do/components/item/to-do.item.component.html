<div class="app-to-do-item" [class.app-to-do-item_selected]="isSelected()" appTooltip="Кликните для подробностей">
    <span class="app-to-do-item__text">{{data().text}}</span>
    <button app-button-title="Delete" appButtonType="DELETE" (click)="onRemove($event)" appTooltip="Удалить задачу">Delete</button>
</div>
